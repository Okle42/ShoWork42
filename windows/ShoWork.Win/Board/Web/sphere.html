                  #5 早報／收工總結 #6 外環＝背景工作進度＋cool42 溫度 #7 ?mini=1＝桌面常駐小球（SphereMini.swift） -->

<title>球體助理</title>
<style>
  :root {
    --bg: #05050a;
    --grid: rgba(255,255,255,.07);
    --pink: #ff5c93;
    --pink-dim: rgba(255,92,147,.35);
    --ink: #f3eef2;
    --ink-dim: rgba(243,238,242,.55);
    --panel: rgba(18,16,24,.78);
    --line: rgba(255,255,255,.14);
    --cyan: #6fd6ff;
    --warn: #ffb020;
    --bad: #ff4d4d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: "SF Pro Display", -apple-system, "PingFang TC", sans-serif; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 48px 48px; background-position: center;
    mask-image: radial-gradient(ellipse at center, #000 30%, transparent 85%); }
  canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* 上方字幕列 */
  #caption { position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    width: min(560px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 10px 14px 12px; backdrop-filter: blur(8px); }
  #caption .who { font-size: 10px; letter-spacing: .18em; color: var(--ink-dim); display: flex; gap: 8px; align-items: center; }
  #caption .who i { width: 6px; height: 6px; border-radius: 50%; background: var(--pink); display: inline-block; transition: background-color 1.2s ease; }
  body.alert #caption .who i { background: var(--warn); }
  #caption .text { margin-top: 6px; font-size: 15px; letter-spacing: .04em; min-height: 1.4em; }
  #caption .bar { margin-top: 8px; height: 2px; background: var(--line); border-radius: 1px; overflow: hidden; }
  #caption .bar b { display: block; height: 100%; width: 0; background: var(--pink); transition: width .25s; }

  /* 資訊小卡 */
  .card { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 10px 12px; min-width: 200px; backdrop-filter: blur(8px);
    opacity: 0; transform: translateY(6px) scale(.98); transition: opacity .35s, transform .35s; pointer-events: none; }
  .card.on { opacity: 1; transform: none; }
  .card .k { font-size: 10px; letter-spacing: .18em; color: var(--ink-dim); }
  .card .head { display: flex; justify-content: space-between; align-items: baseline; margin: 4px 0 8px; }
  .card .head span { font-size: 14px; letter-spacing: .06em; }
  .card .head b { font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .row { display: grid; grid-template-columns: 44px 1fr auto; gap: 8px; font-size: 12px; padding: 5px 0;
    border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .row .t { color: var(--ink-dim); font-size: 10px; letter-spacing: .12em; padding-top: 1px; }
  .meter { grid-column: 1 / -1; height: 2px; background: var(--line); margin-top: 3px; }
  .meter b { display: block; height: 100%; background-color: var(--pink); transition: width .8s ease, background-color 1.2s ease; }
  #cardUsage { left: 24px; top: 34%; }
  #cardTeam { right: 24px; top: 42%; }

  #state { position: fixed; bottom: 64px; left: 0; right: 0; text-align: center; font-size: 12px;
    letter-spacing: .32em; color: var(--ink-dim); }
  #controls { position: fixed; bottom: 16px; left: 0; right: 0; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; padding: 0 16px; }
  #controls button { background: transparent; color: var(--ink-dim); border: 1px solid var(--line); border-radius: 14px;
    padding: 5px 12px; font: inherit; font-size: 12px; cursor: pointer; }
  #controls button:hover, #controls button.on { color: var(--ink); border-color: var(--pink-dim); }
  body.embedded #controls { display: none; }
  #cardTeam { pointer-events: auto; }
  #cardTeam:not(.on) { pointer-events: none; }
  .row.link { cursor: pointer; border-radius: 3px; }
  .row.link:hover { background: rgba(255,255,255,.05); }
  .row.need .t { color: var(--warn); }
  #voice { position: fixed; top: 16px; right: 16px; width: 32px; height: 32px; display: grid; place-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 50%; color: var(--ink-dim); cursor: pointer; padding: 0; }
  #voice.on { color: var(--pink); border-color: var(--pink-dim); }
  #voiceSel { appearance: none; -webkit-appearance: none; max-width: 150px; padding-right: 10px; }
  #voiceSel option, #voiceSel optgroup { background: #13111a; color: var(--ink); }
  #tools #voice { width: 30px; height: 24px; padding: 0; border-radius: 14px; }
  canvas#gl { cursor: pointer; }
  /* v3 #1：需要你的選項面板 */
  #askCard { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%) translateY(8px);
    width: min(580px, calc(100% - 32px)); background: var(--panel); border: 1px solid rgba(255,176,32,.45);
    border-radius: 6px; padding: 10px 14px 12px; backdrop-filter: blur(8px);
    opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; }
  #askCard.on { opacity: 1; pointer-events: auto; transform: translateX(-50%); }
  #askCard .top { display: flex; align-items: center; gap: 8px; font-size: 10px; letter-spacing: .16em; color: var(--warn); }
  #askCard .top .nm { color: var(--ink); letter-spacing: .06em; font-size: 12px; }
  #askCard .top .nav { margin-left: auto; display: flex; gap: 4px; align-items: center; color: var(--ink-dim); }
  #askCard .q { margin-top: 6px; font-size: 14px; line-height: 1.45; max-height: 4.4em; overflow: auto; }
  #askCard .d { margin-top: 4px; font: 11px ui-monospace, Menlo, monospace; color: var(--ink-dim); max-height: 3em; overflow: hidden;
    white-space: pre-wrap; word-break: break-all; }
  #askCard .btns { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 14px;
    padding: 5px 12px; font: inherit; font-size: 12px; cursor: pointer; }
  .pill:hover { border-color: var(--pink-dim); background: rgba(255,92,147,.08); }
  .pill.go { border-color: rgba(255,176,32,.6); }
  .pill.no { color: var(--ink-dim); }
  .pill.sm { padding: 2px 8px; font-size: 11px; }
  #askCard .free { margin-top: 8px; display: flex; gap: 6px; }
  #askCard .free input { flex: 1; min-width: 0; background: rgba(255,255,255,.04); color: var(--ink); border: 1px solid var(--line);
    border-radius: 14px; padding: 5px 12px; font: inherit; font-size: 12px; outline: none; }
  #askCard .free input:focus { border-color: var(--pink-dim); }
  /* v3 #3：衛星提示 */
  #tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    padding: 4px 8px; font-size: 11px; white-space: nowrap; opacity: 0; transition: opacity .15s; z-index: 5; }
  #tip.on { opacity: 1; }
  /* v3 #6：外環說明 */
  #cardSys { left: 24px; top: calc(34% + 205px); }
  /* 右上工具列 */
  #tools { position: fixed; top: 16px; right: 16px; display: flex; gap: 6px; align-items: center; }
  #tools .pill { background: var(--panel); color: var(--ink-dim); }
  #tools .pill.on { color: var(--pink); border-color: var(--pink-dim); }
  #voice { position: static; }
  #hint { position: fixed; bottom: 44px; left: 0; right: 0; text-align: center; font-size: 11px; letter-spacing: .12em; color: rgba(243,238,242,.32); }
  body:not(.embedded) #hint { display: none; }
  /* v3 #7：桌面小球（?mini=1）：只有球＋一行字 */
  body.mini { background: transparent; }
  body.mini::before, body.mini .card, body.mini #tools, body.mini #state, body.mini #controls, body.mini #askCard, body.mini #hint, body.mini #tip { display: none !important; }
  body.mini #caption { top: auto; bottom: 2px; width: calc(100% - 8px); padding: 4px 8px; border-radius: 10px; background: rgba(12,10,18,.72); }
  body.mini #caption .who, body.mini #caption .bar { display: none; }
  body.mini #caption .text { margin: 0; font-size: 11px; min-height: 0; line-height: 1.35; max-height: 2.7em; overflow: hidden; text-align: center; }
  body.mini #caption.quiet { opacity: 0; }
  body.mini #caption { transition: opacity .4s; }
  /* v4 C：衛星小卡 */
  #satCard { background: rgba(14,12,20,.95); position: fixed; width: 280px; z-index: 6; pointer-events: auto; }
  #satCard .head b { font-size: 14px; font-weight: 500; }
  #satCard .ln { font-size: 12px; line-height: 1.5; padding: 4px 0; border-top: 1px solid var(--line); color: var(--ink); }
  #satCard .ln .t { color: var(--ink-dim); font-size: 10px; letter-spacing: .12em; margin-right: 6px; }
  #satCard .detail { color: var(--ink-dim); max-height: 4.5em; overflow: hidden; }
  #satCard .btns { display: flex; gap: 6px; margin-top: 8px; }
  #satCard:not(.on) { pointer-events: none; }
  /* v4 E：今日時間軸 */
  #tlCard { background: rgba(14,12,20,.97); left: 50%; top: 50%; transform: translate(-50%, -48%) scale(.98); width: min(760px, calc(100% - 32px)); max-height: calc(100% - 140px);
    overflow: auto; z-index: 7; pointer-events: auto; }
  #tlCard.on { transform: translate(-50%, -50%); }
  #tlCard:not(.on) { pointer-events: none; }
  .tl { display: grid; grid-template-columns: 110px 1fr; gap: 4px 10px; align-items: center; font-size: 12px; margin-top: 8px; }
  .tl .nm { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tl .bar { position: relative; height: 12px; background: rgba(255,255,255,.04); border-radius: 2px; }
  .tl .bar i { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
  .tl .axis { position: relative; height: 14px; font-size: 10px; color: var(--ink-dim); }
  .tl .axis span { position: absolute; transform: translateX(-50%); }
  .tl .axis span::before { content: ""; position: absolute; left: 50%; top: -3px; height: 3px; border-left: 1px solid var(--line); }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--ink-dim); margin-top: 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  @media (max-width: 640px) {
    #cardUsage { left: 16px; top: auto; bottom: 120px; min-width: 0; width: calc(50% - 24px); }
    #cardTeam { right: 16px; top: auto; bottom: 120px; min-width: 0; width: calc(50% - 24px); }
    #cardSys { display: none; }
    #askCard { bottom: 76px; }
  }
</style>

<script type="module">
import * as THREE from "three";
const MINI = new URLSearchParams(location.search).has("mini");     // 桌面常駐小球（v3 #7）
if (MINI) document.body.classList.add("mini");

/* ---------- 狀態定義：每個狀態的轉速、亮度、標籤 ---------- */
const STATES = {
  idle:      { label: "待命",  spin: 0.15, glow: 0.45, pulse: 0.0, scatter: 0 },
  listening: { label: "聆聽中", spin: 0.25, glow: 0.75, pulse: 0.35, scatter: 0 },
  thinking:  { label: "思考中", spin: 0.9,  glow: 0.65, pulse: 0.15, scatter: 0 },
  searching: { label: "搜尋中", spin: 1.4,  glow: 0.85, pulse: 0.1, scatter: 1 },
  speaking:  { label: "說話中", spin: 0.35, glow: 1.0,  pulse: 0.0, scatter: 0 },
  alert:     { label: "需要你", spin: 0.6,  glow: 1.0,  pulse: 0.6, scatter: 0 },
};
let state = "idle", tgt = { ...STATES.idle }, cur = { ...STATES.idle };
let speakAmp = 0;               // 說話時的「音量」，驅動球體脹縮
const PINK = new THREE.Color("#ff5c93"), CYAN = new THREE.Color("#6fd6ff"), ORANGE = new THREE.Color("#ffb020"), RED = new THREE.Color("#ff4d4d");
// 11-21 Keng：顏色不要瞬間跳 ⇒ 每個會換色的東西都走 Fade：從「現在的顏色」用 1.2 秒緩入緩出漸到新顏色（中途又換也是從當下接著漸）
const nowS = () => performance.now() / 1000;
class Fade {
  constructor(c, dur = 1.2) { this.c = c.clone(); this.from = c.clone(); this.to = c.clone(); this.t0 = -1e9; this.dur = dur; }
  set(col) { if (this.to.equals(col)) return; this.from.copy(this.c); this.to.copy(col); this.t0 = nowS(); }
  step() { const k = Math.min(1, (nowS() - this.t0) / this.dur), e = k * k * (3 - 2 * k); return this.c.copy(this.from).lerp(this.to, e); }
}
const accentFade = new Fade(PINK, 1.4);
let accent = accentFade.c;

/* ---------- three.js 場景 ---------- */
const canvas = document.getElementById("gl");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
camera.position.set(0, 0, 9);
const root = new THREE.Group(); scene.add(root);

const mats = [];
function lineMat(op) { const m = new THREE.LineBasicMaterial({ color: PINK, transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false }); m.userData.base = op; mats.push(m); return m; }
function meshMat(op) { const m = new THREE.MeshBasicMaterial({ color: PINK, transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }); m.userData.base = op; mats.push(m); return m; }

// 1. 內核：會被「聲音」擾動的線框球
// 線框只建一次，之後每格直接移動它的頂點（不重建幾何，省 CPU）
const coreGeo = new THREE.WireframeGeometry(new THREE.IcosahedronGeometry(1.15, 4));
const corePos0 = coreGeo.attributes.position.array.slice();
const core = new THREE.LineSegments(coreGeo, lineMat(0.10));
root.add(core);

// 2. 三角面殼：每個面縮小成一片小三角形（影片裡的三角鏤空）
const shell = new THREE.Group(); root.add(shell);
{
  const ico = new THREE.IcosahedronGeometry(1.55, 1).toNonIndexed();
  const p = ico.attributes.position;
  const tri = [], v = [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()], c = new THREE.Vector3();
  for (let i = 0; i < p.count; i += 3) {
    for (let k = 0; k < 3; k++) v[k].fromBufferAttribute(p, i + k);
    c.copy(v[0]).add(v[1]).add(v[2]).divideScalar(3);
    for (let k = 0; k < 3; k++) { const q = v[k].clone().lerp(c, 0.42); tri.push(q.x, q.y, q.z); }
  }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(tri, 3));
  shell.add(new THREE.Mesh(g, meshMat(0.08)));
  shell.add(new THREE.LineSegments(new THREE.EdgesGeometry(g), lineMat(0.45)));
}

// 3. 六角網格外殼（淡）
{
  const g = new THREE.IcosahedronGeometry(1.85, 1);
  const hex = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.DodecahedronGeometry(1.85, 1)), lineMat(0.12));
  root.add(hex); hex.userData.spin = -0.4; root.userData.hex = hex;
}

// 4. 環形 HUD：分段的圓弧，各自傾斜、各自轉
const rings = [];
function arcRing(r, w, segs, tilt, speed, op) {
  const grp = new THREE.Group();
  let a = 0;
  for (let i = 0; i < segs; i++) {
    const len = (Math.PI * 2 / segs) * (0.35 + Math.random() * 0.55);
    const geo = new THREE.RingGeometry(r, r + w, 48, 1, a, len);
    grp.add(new THREE.Mesh(geo, meshMat(op * (0.5 + Math.random() * 0.5))));
    a += Math.PI * 2 / segs;
  }
  // 細線外框
  const circ = new THREE.EllipseCurve(0, 0, r + w + 0.04, r + w + 0.04).getPoints(160);
  grp.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(circ), lineMat(op * 0.6)));
  grp.rotation.set(tilt[0], tilt[1], tilt[2]);
  grp.userData.speed = speed;
  root.add(grp); rings.push(grp);
  return grp;
}
arcRing(2.15, 0.07, 9, [1.25, 0.15, 0], 0.30, 0.55);
arcRing(2.45, 0.04, 14, [1.05, -0.35, 0.2], -0.22, 0.45);
arcRing(2.85, 0.12, 6, [1.35, 0.45, -0.1], 0.14, 0.40);
arcRing(1.95, 0.02, 24, [0, 0, 0], -0.5, 0.35);

// 5. 搜尋時往外飛的資料碎片
const bits = [];
{
  const g = new THREE.CircleGeometry(0.06, 6);
  for (let i = 0; i < 40; i++) {
    const m = new THREE.Mesh(g, meshMat(0.0));
    m.userData = { dir: new THREE.Vector3().randomDirection(), t: Math.random(), speed: 0.15 + Math.random() * 0.25 };
    root.add(m); bits.push(m);
  }
}

// 6. v3 #3 session 衛星：每個 session 一顆小光點繞球；顏色＝狀態，需要你的會脈動、點了跳過去
const SAT_COLOR = { "需要你": ORANGE, "進行中": PINK, "待審": CYAN, "卡住": RED, "完成": new THREE.Color("#7dffb0") };
const SAT_GRAY = new THREE.Color("#8a8494");
const satGroup = new THREE.Group(); scene.add(satGroup);
const sats = new Map();             // sessionId → { mesh, hit, halo, c, orbit }
const satGeo = new THREE.IcosahedronGeometry(0.075, 1), haloGeo = new THREE.RingGeometry(0.11, 0.135, 24), hitGeo = new THREE.SphereGeometry(0.24, 8, 6);
function hash(str) { let h = 2166136261; for (const ch of str) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function syncSats(team) {
  const keep = new Set();
  for (const c of team.slice(0, 16)) {
    if (!c.sessionId) continue;
    keep.add(c.sessionId);
    let s = sats.get(c.sessionId);
    if (!s) {

// 7. v3 #6 外環：背景長工作的進度弧（最多 3 條）＋最外圈 cool42 溫度弧；面向鏡頭
const outer = new THREE.Group(); scene.add(outer);
const outerArcs = [];   // { mesh, track, key }

  if (heat?.temp != null) {

    heatFade.set(col);

  for (const a of outerArcs) { outer.remove(a.mesh, a.track); a.mesh.geometry.dispose(); a.track.geometry.dispose(); }

const clock = new THREE.Clock();
const tmp = new THREE.Vector3();
let lastDraw = 0, wordPulse = 0, bounceAt = -1e9;
const bitMats = new Set(bits.map(b => b.material));
function frame(now) {
  requestAnimationFrame(frame);
  // 11-21 Keng 錄影：機器熱時降到 8 張／秒，看起來一頓一頓 ⇒ 不再砍張數，改砍解析度（像素少 4 倍，GPU 省更多）

  // 內核頂點擾動
  const pos = coreGeo.attributes.position.array;

  for (let i = 0; i < pos.length; i += 3) {
    const x = corePos0[i], y = corePos0[i + 1], z = corePos0[i + 2];
    const d = 1 + n * Math.sin(x * 3 + t * 2.1) * Math.sin(y * 3.4 + t * 1.7) * Math.sin(z * 2.7 + t * 1.3);

  for (const r of rings) r.rotateZ(dt * r.userData.speed * (0.4 + cur.spin));

}

$("bMini").onclick = () => post({ action: "mini" });
$("voiceSel").onchange = e => {
  if (!voiceOn) { voiceOn = true; try { localStorage.setItem("sphere.voice", "1"); } catch {} renderVoice(); }   // 選聲音＝想聽：順手打開語音
  post({ action: "setVoice", id: e.target.value });
};

/* ---------- v3 #1 需要你：球下方的選項面板（回答／放行），一次一件，‹ › 換下一件 ---------- */
let askSid = null;
const sentKey = new Map();          // sessionId → 已按過的那題（題目沒變前不再顯示）
function askKey(c) { return (c.permit?.id || "") + "|" + (c.ask || ""); }
function pending() { return (data.team || []).filter(c => c.status === "需要你" && c.sessionId && sentKey.get(c.sessionId) !== askKey(c)); }
function renderAsk() {
  const list = pending(), card = $("askCard");
  if (!list.length || MINI) { card.classList.remove("on"); askSid = null; return; }
  let i = list.findIndex(c => c.sessionId === askSid); if (i < 0) i = 0;
  const c = list[i]; askSid = c.sessionId;
  const sig = askKey(c) + "#" + i + "/" + list.length;
  if (card.dataset.sig === sig && card.classList.contains("on")) return;     // 沒變就不重畫（不打斷正在打的字）
  card.dataset.sig = sig;
  const p = c.permit, btn = (label, act, cls = "") => `<button class="pill ${cls}" data-act='${esc(JSON.stringify(act))}'>${esc(label)}</button>`;
  let btns = "", free = false, detail = "";
  if (p?.kind === "tool") {
    detail = p.summary || "";
    btns = btn("允許", { permit: "allow" }, "go") + btn("一律允許", { permit: "always" }) + btn("拒絕", { permit: "deny" }, "no");
  } else if (p?.kind === "plan") {
    btns = btn("核准計畫", { permit: "allow" }, "go") + btn("退回", { permit: "deny" }, "no");
  } else if (p?.kind === "ask") {
    const qs = p.questions || [];
    if (qs.length === 1 && !qs[0].multi) btns = qs[0].options.map(o => btn(o, { permit: "allow", answers: { [qs[0].question]: [o] } }, "go")).join("");
    else detail = `${qs.length} 題選擇題，到它的視窗回答比較清楚。`;
  } else {
    btns = (c.options || []).map(o => btn(o, { text: o }, "go")).join("");
    free = true;
  }
  btns += btn("跳到它的視窗", { focus: 1 }, "no");
  card.innerHTML = `<div class="top"><span>需要你</span><span class="nm">${esc(c.name || "")}</span>
      ${list.length > 1 ? `<span class="nav"><button class="pill sm" data-nav="-1">‹</button>${i + 1}/${list.length}<button class="pill sm" data-nav="1">›</button></span>` : ""}</div>
    <div class="q">${esc(c.ask || "在等你。")}</div>${detail ? `<div class="d">${esc(detail)}</div>` : ""}
    <div class="btns">${btns}</div>
    ${free ? `<form class="free"><input placeholder="或自己打一句回答⋯" aria-label="自己打回答"><button class="pill">送出</button></form>` : ""}`;
  card.classList.add("on");
}
$("askCard").addEventListener("click", e => {
  const nav = e.target.closest("[data-nav]");
  if (nav) { const list = pending(); let i = list.findIndex(c => c.sessionId === askSid); askSid = list[(i + +nav.dataset.nav + list.length) % list.length]?.sessionId; renderAsk(); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const c = (data.team || []).find(x => x.sessionId === askSid); if (!c) return;
  const a = JSON.parse(b.dataset.act);
  if (a.focus) return post({ action: "focus", sessionId: c.sessionId });
  if (a.permit) post({ action: "permit", sessionId: c.sessionId, permitId: c.permit?.id, decision: a.permit, answers: a.answers });
  else post({ action: "answer", sessionId: c.sessionId, text: a.text });
  done(c);
});
$("askCard").addEventListener("submit", e => {
  e.preventDefault();
  const v = e.target.querySelector("input").value.trim(); if (!v) return;
  const c = (data.team || []).find(x => x.sessionId === askSid); if (!c) return;
  post({ action: "answer", sessionId: c.sessionId, text: v }); done(c);
});
function done(c) { sentKey.set(c.sessionId, askKey(c)); askSid = null; $("askCard").dataset.sig = ""; renderAsk(); autoState(); }
window.karaSetState = setState;
window.karaData = () => data;            // 測試注入碼讀資料用（SHOWORK_TEST_SPHERE_JS）
window.karaAnchor = (x, y) => { satAnchor = { x, y }; };
window.karaSay = (text) => announce(text);
window.karaToast = (text) => announce(text);
let embedded = false;
async function poll() {
  if (embedded) return;
  try { const r = await fetch("/usage", { cache: "no-store" }); if (r.ok) { Object.assign(data, await r.json()); render(); } } catch {}
}
poll(); setInterval(poll, 30000);

// 現況一句話
function statusLine() {
  const team = data.team || [];
  const n = st => team.filter(c => c.status === st).length;
  const parts = [];
  if (n("需要你")) parts.push(`${n("需要你")} 個在等你回答`);
  if (n("進行中")) parts.push(`${n("進行中")} 個進行中`);
  if (n("待審")) parts.push(`${n("待審")} 個待審`);
  if (n("卡住")) parts.push(`${n("卡住")} 個卡住`);
  return team.length ? parts.join("，") || "大家都閒著" : "目前沒有 session";
}
// 嵌在戰情中心時：有人等你回答就亮橘、有人在跑就轉、都閒就待命
function autoState() {
  const team = data.team || [];
  show("cardUsage", true); show("cardTeam", team.length > 0);
  if (demoRunning || talkingNow) return;
  if (listening) return;
  if (pending().length) setState("alert");
  else if (team.some(c => c.status === "進行中")) setState("thinking");
  else setState("idle");
  const n = pending().length;
  const line = MINI ? (n ? `${n} 個在等你` : "") : statusLine();
  if (!typing && $("capText").textContent !== line) { $("capText").textContent = line; $("capBar").style.width = "100%"; }
  if (MINI) $("caption").classList.toggle("quiet", !typing && !line);
}
/* ---------- 滑鼠：點衛星＝跳過去；點球＝唸現況；按住球（或空白鍵）＝講話交給隊長（v3 #2） ---------- */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
function satAt(e) {
  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects([...sats.values()].map(s => s.hit), false)[0];
  return hit ? sats.get(hit.object.userData.sid) : null;
}
let hovered = null;
canvas.addEventListener("pointermove", e => {
  const s = satAt(e);
  if (hovered && hovered !== s) hovered.hover = false;
  hovered = s; if (s) s.hover = true;
  const tip = $("tip");
  if (s?.c) {
    tip.textContent = `${s.c.name} · ${s.c.status}${s.c.doing ? " · " + clip(s.c.doing, 24) : ""}`;
    tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = (e.clientY + 14) + "px";
  }
  tip.classList.toggle("on", !!s);
});
let holdTimer = null, listening = false, heard = "", heardFinal = null, heardDone = false;
canvas.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  const s = satAt(e);
  if (s?.c) { satAnchor = { x: e.clientX, y: e.clientY }; post({ action: "sessionInfo", sessionId: s.c.sessionId }); return; }
  closeSat();
  holdTimer = setTimeout(() => { holdTimer = null; startListen(); }, 380);
});
addEventListener("pointerup", () => {
  if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; announce(`${statusLine()}。這 5 小時用了 ${pct(data.five_hour)}，這週 ${pct(data.seven_day)}。`); }
  else if (listening) stopListen();
});
function startListen() {
  if (listening || !host()) { if (!host()) announce("按住講話要在戰情中心裡用。"); return; }
  listening = true; heard = ""; heardDone = false; queue.length = 0;
  post({ action: "stopSpeaking" });
  setState("listening");
  $("who").textContent = "球體 · 聆聽中（放開就交給隊長）";
  $("capText").textContent = "我在聽⋯"; $("capBar").style.width = "0%";
  post({ action: "listen", on: true });
}
function stopListen() {
  if (!listening) return;
  post({ action: "listen", on: false });
  if (heardDone) return finishListen();          // 還按著時辨識就給了最後一句：放開直接送
  setState("thinking"); $("who").textContent = "球體 · 整理你說的話";
  // 等原生端給最後一句（karaHeard final）；3 秒沒回就用目前聽到的
  const t = setTimeout(() => finishListen(), 3000);
  heardFinal = () => { clearTimeout(t); finishListen(); };
}
window.karaHeard = (text, final) => {
  if (text) { heard = text; $("capText").textContent = text; $("capBar").style.width = Math.min(100, text.length * 4) + "%"; }
  if (final) heardDone = true;
  if (final && heardFinal) { const f = heardFinal; heardFinal = null; f(); }
  else if (final && listening && !text) { listening = false; autoState(); }     // 還按著就出錯了（權限、沒麥克風）：原生端會另外說原因
};
function finishListen() {
  heardFinal = null;
  if (!listening) return;
  listening = false;
  const text = heard.trim();
  if (!text) { announce("沒聽清楚，再按住球講一次。"); return; }
  const local = /^(交給|跟|告訴|請)隊長/.test(text) ? null : answerLocal(text);
  if (local) { announce(local); return; }
  post({ action: "captain", text: text.replace(/^(交給|跟|告訴|請)隊長(說)?[，,：:\s]*/, "") || text });
  handoffAt = Date.now();
  announce(`交給隊長：${clip(text, 40)}`);
}

/* ---------- v4 B：簡單的問題球自己答（用手上的資料，不花隊長的額度）；答不了才交給隊長 ---------- */
function answerLocal(q) {
  const t = q.replace(/\s+/g, "");
  const team = data.team || [];
  if (/早報|今天(的)?狀況/.test(t)) return briefText();
  if (/收工|總結/.test(t)) return wrapText();
  if (/額度|用量|用了多少|剩多少|還剩/.test(t)) {
    return `5 小時額度用了 ${pct(data.five_hour)}${data.five_reset != null ? "，" + resetText(data.five_reset) : ""}；這週用了 ${pct(data.seven_day)}${data.seven_reset != null ? "，" + resetText(data.seven_reset) : ""}。`;
  }
  if (/溫度|很熱|多熱|風扇/.test(t)) return data.heat?.temp != null ? `機器現在 ${Math.round(data.heat.temp)} 度，${{ ok: "正常", warm: "偏熱", hot: "很熱", critical: "過熱" }[data.heat.level] || data.heat.level}。` : "現在讀不到機器溫度。";
  if (/幾點|現在時間/.test(t) && t.length < 12) { const d = new Date(); return `現在 ${d.getHours()} 點 ${d.getMinutes()} 分。`; }
  if (/誰.*(等我|需要我|找我)|需要我|等我(回答|決定)|有什麼要我/.test(t)) {
    const p = pending();
    return p.length ? `${p.length} 個在等你：${p.slice(0, 4).map(c => `${c.name}${c.ask ? "（" + clip(c.ask, 18) + "）" : ""}`).join("、")}。` : "現在沒有人在等你。";
  }
  const asksStatus = /在幹嘛|在做什麼|在忙什麼|進度|狀況|怎麼樣|好了沒|做完了?沒|做到哪/.test(t);
  if (asksStatus) {
    const lower = t.toLowerCase();
    const c = team.filter(c => c.name).sort((a, b) => b.name.length - a.name.length).find(c => lower.includes(c.name.toLowerCase()));
    if (c) return `${c.name}${c.status === "需要你" ? " 在等你回答" + (c.ask ? "：" + clip(c.ask, 30) : "") : "：" + c.status}${c.doing ? "，正在" + clip(c.doing, 24) : ""}${c.progress != null ? "，進度 " + c.progress + "%" : ""}${c.summary && c.status !== "進行中" ? "。" + clip(c.summary, 40) : ""}。`;
    if (/大家|全部|現況|整體/.test(t)) return `${statusLine()}。`;
  }
  if (/^(現況|大家呢?|狀況如何)/.test(t)) return `${statusLine()}。`;
  return null;
}

/* ---------- v4 A：交給隊長後，隊長回話就唸出來（20 分鐘內的第一句回覆） ---------- */
let handoffAt = 0, captainSeen = undefined;
function captainReply() {
  const c = data.captain; if (!c?.id) return;
  if (captainSeen === undefined) { captainSeen = c.id; return; }      // 第一次只記下來
  if (c.id === captainSeen) return;
  captainSeen = c.id;
  if (!handoffAt || Date.now() - handoffAt > 20 * 60 * 1000 || MINI) return;
  handoffAt = 0;
  const plain = String(c.text).replace(/```[\s\S]*?```/g, "（程式碼略）").replace(/[#*`>|_]/g, "").replace(/\s+/g, " ").trim();
  announce(`隊長回覆：${clip(plain, 90)}`);
}

/* ---------- v4 C：點衛星展開小卡 ---------- */
let satAnchor = { x: 0, y: 0 }, satSid = null;
window.karaSessionInfo = (o) => {
  satSid = o.sessionId;
  const ln = (k, v) => v == null || v === "" ? "" : `<div class="ln"><span class="t">${k}</span>${esc(v)}</div>`;
  const ago = o.ago == null ? null : o.ago < 1 ? "剛剛" : o.ago < 60 ? `${o.ago} 分鐘前` : `${Math.floor(o.ago / 60)} 小時前`;
  const el = $("satCard");
  el.innerHTML = `<div class="k">SESSION · ${esc(o.project || "")}</div>
    <div class="head"><b>${esc(o.name)}</b><span style="font-size:12px;color:${o.status === "需要你" ? "var(--warn)" : "var(--ink-dim)"}">${esc(o.status)}</span></div>
    ${ln("做", o.doing)}${ln("進度", o.progress != null ? o.progress + "%" : null)}${ln("記憶", o.ctx != null ? o.ctx + "%" : null)}
    ${ln("動靜", ago)}${ln("子代理", o.subagents ? o.subagents + " 個在跑" : null)}${ln("摘要", o.summary)}
    ${o.detail ? `<div class="ln detail"><span class="t">最後一句</span>${esc(o.detail)}</div>` : ""}
    <div class="btns"><button class="pill sm" data-go>跳到它的視窗</button><button class="pill sm no" data-x>關閉</button></div>`;
  const w = 280, h = el.offsetHeight || 220;
  el.style.left = Math.max(12, Math.min(satAnchor.x + 16, innerWidth - w - 12)) + "px";
  el.style.top = Math.max(12, Math.min(satAnchor.y - 20, innerHeight - h - 12)) + "px";
  show("satCard", true);
};
function closeSat() { show("satCard", false); satSid = null; }
$("satCard").addEventListener("click", e => {
  if (e.target.closest("[data-go]") && satSid) { post({ action: "focus", sessionId: satSid }); closeSat(); }
  else if (e.target.closest("[data-x]")) closeSat();
});

/* ---------- v4 D：彈一下 ---------- */
window.karaBounce = () => { bounceAt = performance.now(); if (MINI) $("caption").classList.remove("quiet"); };

/* ---------- v4 E：今日時間軸 ---------- */
const TL_COLOR = { "需要你": "var(--warn)", "進行中": "var(--pink)", "待審": "var(--cyan)", "卡住": "var(--bad)", "完成": "#7dffb0", "待辦": "#8a8494" };
$("bTl").onclick = () => { if ($("tlCard").classList.contains("on")) return show("tlCard", false); post({ action: "timeline" }); };
window.karaTimeline = (d) => {
  const lanes = d.lanes || [], now = d.now || 0;
  const first = Math.min(now - 60, ...lanes.flatMap(l => l.segs.map(s => s.s)));
  const from = Math.max(0, Math.floor(first / 60) * 60), span = Math.max(60, now - from);
  const x = m => ((m - from) / span * 100).toFixed(2) + "%";
  const ticks = []; for (let h = Math.ceil(from / 60); h * 60 <= now; h += span > 600 ? 2 : 1) ticks.push(`<span style="left:${x(h * 60)}">${h}:00</span>`);
  const rows = lanes.map(l => `<div class="nm" title="${esc(l.name)}">${esc(l.name)}</div><div class="bar">${l.segs.map(s =>
    `<i style="left:${x(s.s)};width:${Math.max(0.3, (s.e - s.s) / span * 100).toFixed(2)}%;background:${TL_COLOR[s.status] || "#8a8494"}" title="${esc(s.status)} ${fmt(s.s)}–${fmt(s.e)}"></i>`).join("")}</div>`).join("");
  $("tlCard").innerHTML = `<div class="k">今日時間軸 · 每個 session 的狀態</div>
    <div class="head"><span>${lanes.length ? `${lanes.length} 個 session` : "今天還沒有紀錄（從這版裝好後開始記）"}</span><button class="pill sm no" data-x>關閉</button></div>
    ${lanes.length ? `<div class="tl">${rows}<div></div><div class="axis">${ticks.join("")}</div></div>` : ""}
    <div class="legend">${Object.entries(TL_COLOR).map(([k, c]) => `<span><i style="background:${c}"></i>${k}</span>`).join("")}</div>`;
  show("tlCard", true);
};
function fmt(m) { m = Math.round(m); return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}`; }
$("tlCard").addEventListener("click", e => { if (e.target.closest("[data-x]")) show("tlCard", false); });
addEventListener("keydown", e => { if (e.key === "Escape") { closeSat(); show("tlCard", false); } });
addEventListener("keydown", e => {
  if (e.code !== "Space" || e.repeat || !embedded || e.target.closest?.("input,textarea")) return;
  e.preventDefault(); e.stopImmediatePropagation(); startListen();
}, true);
addEventListener("keyup", e => { if (e.code === "Space" && embedded && listening) { e.preventDefault(); stopListen(); } }, true);

/* ---------- 示範一輪（照影片的流程，數字用真的） ---------- */
let demoRunning = false;
async function demo() {
  if (demoRunning || talkingNow) return; demoRunning = true;
  show("cardUsage", false); show("cardTeam", false);
  setState("speaking"); await speak("你好，我是球體助理。");
  setState("listening"); await say("我在聽。", 90); await wait(1200);
  setState("thinking"); await say("讓我想一下⋯", 90); await wait(1400);
  setState("searching"); await say("正在查資料、整理給你。"); await wait(1800);
  setState("speaking"); show("cardUsage", true);
  await speak(`記憶量 ${pct(data.ctx)}，這 5 小時用了 ${pct(data.five_hour)}，這週 ${pct(data.seven_day)}。`);
  show("cardTeam", true);
  await speak(`現在有 ${data.sessions ?? "幾"} 個 session 在線。`);
  await wait(800);
  setState("idle"); await speak("有事再叫我。"); demoRunning = false;
  embedded ? autoState() : null;
}
document.querySelectorAll("#controls button[data-s]").forEach(b => b.onclick = () => setState(b.dataset.s));
$("demo").onclick = demo;
addEventListener("keydown", e => { if (e.code === "Space" && !embedded) { e.preventDefault(); demo(); } });

setState("idle"); render(); renderVoice(); show("cardUsage", true);
if (new URLSearchParams(location.search).has("demo")) setTimeout(demo, 600);
post({ action: "ready" });
</script>
